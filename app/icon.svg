<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="stowaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="waveGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#e11d48" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#stowaveGrad)" filter="url(#glow)" />
  
  <!-- Subtle Frosted Glass Inner Ring -->
  <rect x="28" y="28" width="456" height="456" rx="124" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />

  <!-- Bold Stowave "S" -->
  <text x="175" y="340" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="280" font-weight="900" fill="#ffffff" letter-spacing="-6">S</text>

  <!-- Fluid Elegant Wave Swash across the S -->
  <path d="M 230 330 C 280 270, 340 380, 410 320 C 425 305, 435 280, 440 260 C 430 280, 410 300, 390 310 C 340 330, 300 250, 240 320 Z" fill="url(#waveGlass)" />

  <!-- Subtle Water Specular Highlight dot -->
  <circle cx="395" cy="140" r="14" fill="#ffffff" opacity="0.8" />
  <circle cx="415" cy="160" r="7" fill="#ffffff" opacity="0.5" />
</svg>
